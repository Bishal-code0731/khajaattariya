name: khaja_attariya
description: Khaja Attariya – Food delivery app for Attariya, Sudurpashchim.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any                      # Dates, numbers, plurals for EN + NE (D-12)

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1               # imported directly by a few providers
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Backend: Supabase ─────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Firebase (FCM push notifications) ────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # ── Environment variables ─────────────────────────────────
  flutter_dotenv: ^5.1.0

  # ── HTTP ─────────────────────────────────────────────────

  # ── Payments ─────────────────────────────────────────────
  url_launcher: ^6.3.0          # Opens Khalti payment URL
  app_links: ^6.3.2             # Deep-link callback for Khalti checkout return

  # ── Image handling ───────────────────────────────────────
  image_picker: ^1.1.2          # Profile/restaurant/menu image picking
  flutter_image_compress: ^2.3.0 # Client-side re-encode before upload (storage budget)

  # ── Local storage ─────────────────────────────────────────
  shared_preferences: ^2.3.2    # Theme persistence + offline cache/retry queue

  # ── Connectivity ──────────────────────────────────────────
  connectivity_plus: ^6.0.5     # Online/offline detection for offline-first UX

  # ── UI ───────────────────────────────────────────────────
  cached_network_image: ^3.3.1  # Cached remote images
  shimmer: ^3.0.0               # Loading skeleton effect
  fl_chart: ^0.69.0             # Restaurant analytics charts
  share_plus: ^10.0.2           # CSV export / share sheet

  # ── Live rider tracking ───────────────────────────────────
  flutter_map: ^7.0.2           # OpenStreetMap tiles — free, no API key
  latlong2: ^0.9.1
  geolocator: ^13.0.1           # Device location for riders

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env                       # Supabase URL + anon key
    - assets/images/             # Static local images
    - assets/icons/              # App icons

  fonts:
    - family: Mukta              # Latin + Devanagari (D-13), SIL OFL — assets/fonts/OFL.txt
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800

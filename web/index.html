<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Local food from Attariya restaurants, delivered fast.">
  <meta name="theme-color" content="#0B6E4F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Khaja Attariya">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Khaja Attariya</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Branded loading screen shown until Flutter draws over it. */
    html, body { margin: 0; height: 100%; background: #0B6E4F; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; font-family: system-ui, sans-serif; color: #fff; }
    #boot img { width: 88px; height: 88px; }
    #boot .name { font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
    #boot .motto { font-size: 15px; opacity: .85; margin-top: -10px; }
    #boot .dots { position: fixed; bottom: 48px; display: flex; gap: 8px; }
    #boot .dots i { width: 9px; height: 9px; border-radius: 50%; background: #F5A524; animation: bounce 1.2s infinite ease-in-out; }
    #boot .dots i:nth-child(2) { animation-delay: .15s; }
    #boot .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-6px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot .dots i { animation: none; opacity: .7; } }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><img src="icons/Icon-192.png" alt=""><span class="name">Khaja Attariya</span><span class="motto">Local food, delivered fast</span><div class="dots"><i></i><i></i><i></i></div></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
